<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="2016" viewBox="0 0 680 1008" role="img">
<title>Meteor Mite and The Gale: a comic in eight panels</title>
<desc>Two heroes share Eastgate and a handler, Kip. Before 12 August both get about 12 calls a week. After the answer window drops from 90 to 60 seconds, Mite misses four calls in five days, then gets 3, 2 and 1 calls a week while The Gale gets 15, 20 and 15. Mite asks Kip if something is broken. Kip says Mite thinks Mite's been forgotten and Gale is exhausted.</desc>
